name: Build OpenFG
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "NDK_PATH=$HOME/android-ndk-r26d" >> $GITHUB_ENV

      - name: Build Native Module
        run: |
          cd module/src
          $NDK_PATH/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk 2>&1 | tee build_log.txt
          mkdir -p ../zygisk
          cp libs/arm64-v8a/libopenfg_clone.so ../zygisk/arm64-v8a.so
          cp libs/armeabi-v7a/libopenfg_clone.so ../zygisk/armeabi-v7a.so

      - name: Build Android app
        run: |
          cd app
          gradle assembleDebug --no-daemon

      - name: Package Zygisk Module
        run: |
          cd module
          zip -r openfg_module.zip . -x "src/*" "zygisk/*.placeholder"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openfg-builds
          path: |
            app/build/outputs/apk/debug/*.apk
            module/openfg_module.zip
            module/src/build_log.txt
