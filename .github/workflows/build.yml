name: build
on: [push, workflow_dispatch]
jobs:
  build-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - run: |
          mkdir -p module/obj
          $ANDROID_NDK_HOME/ndk-build -C module NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk 2>&1 | tail -20 || echo "configure Android.mk first"
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
      - run: cd app && ./gradlew assembleDebug
